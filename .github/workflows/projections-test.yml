name: Projections — engine tests

# Pytest for the pure projection math: franchise_edge.py (the edge.py port),
# season_windows.py, and the season model's small-sample shrinkage
# (test_season_shrinkage.py). Runs on any change to the projections engine.
# The shrinkage tests import season_project, which pulls the full engine deps —
# so this installs requirements.txt, not just pytest.
on:
  push:
    paths: ['projections/**']
  pull_request:
    paths: ['projections/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projections/requirements.txt
      - name: Install dependencies
        run: pip install -r projections/requirements.txt pytest
      - name: Run engine tests
        run: cd projections && python -m pytest tests/ -q
