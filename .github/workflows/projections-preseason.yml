name: Projections — preseason snapshot

# Pre-season / draft snapshot. Fires daily through the offseason/preseason so
# the draft board absorbs injuries, trades and role changes right up to opening
# night. Targets each sport's NEXT unopened season (resolve_phase.py), freezing
# the baseline at the last write before tipoff, when the daily game-by-game job
# takes over.
#
# workflow_dispatch also accepts an explicit `season` (START YEAR — 2026 means
# WNBA '2026' / NBA '2026-27') — use it to snapshot the CURRENT season
# mid-stream. That's the "what we expected before the season" baseline the
# analytics "Performance vs Expected" card compares actuals against; the season
# model ignores the target season's own games, so it's a true preseason
# expectation regardless of when you run it. An explicit-season dispatch runs
# only the chosen sport's matrix leg.
on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC daily (offset from the game-by-game job)
  workflow_dispatch:
    inputs:
      season:
        description: 'Explicit season START YEAR to snapshot (e.g. 2026). Blank = auto (targets the next unopened season per sport).'
        required: false
        default: ''
      sport:
        description: 'Sport for an explicit-season run. Ignored when season is blank (auto runs both).'
        required: false
        type: choice
        options: ['wnba', 'nba']
        default: 'wnba'

jobs:
  project:
    runs-on: ubuntu-latest
    strategy:
      # One sport's crash must not cancel the other's run.
      fail-fast: false
      matrix:
        sport: [wnba, nba]
    concurrency:
      group: projections-preseason-${{ matrix.sport }}
      cancel-in-progress: false
    env:
      PG_DSN: ${{ secrets.PG_DSN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projections/requirements.txt

      - name: Install dependencies
        run: pip install -r projections/requirements.txt

      - name: Resolve season phase
        id: phase
        # Assign first (not `echo "$(…)"`) so a non-zero exit from the resolver
        # — e.g. a failed DB connection — fails this step loudly instead of
        # silently emitting an empty season that breaks the next step's args.
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            # Explicit override (e.g. current season for the PvE baseline).
            # Only the chosen sport's matrix leg runs it; the other leg SKIPs
            # (matrix isn't available in a job-level `if`, so gate here).
            if [ "${{ inputs.sport }}" = "${{ matrix.sport }}" ]; then
              season="${{ inputs.season }}"
            else
              season="SKIP"
            fi
          else
            season="$(python projections/resolve_phase.py season ${{ matrix.sport }})"
          fi
          echo "season=$season" >> "$GITHUB_OUTPUT"

      - name: Generate season snapshot
        if: steps.phase.outputs.season != 'SKIP' && steps.phase.outputs.season != ''
        run: python projections/franchise_project.py --sport ${{ matrix.sport }} --season ${{ steps.phase.outputs.season }} --horizon season

      - name: Skipped
        if: steps.phase.outputs.season == 'SKIP'
        run: echo "No target season for ${{ matrix.sport }}; see the resolver step's stderr for the reason."
